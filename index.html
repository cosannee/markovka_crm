function renderDonutChart(data,total){
  var size=180;var cx=size/2;var cy=size/2;var r=62;var strokeW=26;
  var sum=data.reduce(function(s,d){return s+d.val;},0);
  if(!sum)return'';
  var paths='';var offset=0;var circumference=2*Math.PI*r;
  // Legend
  var legend='<div style="display:flex;flex-direction:column;gap:6px;justify-content:center;flex:1">';
  data.forEach(function(d){
    var dashArr=(d.val/sum)*circumference;
    var dashOff=-(offset/sum)*circumference;
    paths+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" '
      +'stroke="'+d.color+'" stroke-width="'+strokeW+'" '
      +'stroke-dasharray="'+dashArr+' '+circumference+'" '
      +'stroke-dashoffset="'+dashOff+'" '
      +'transform="rotate(-90 '+cx+' '+cy+')">'
      +'</circle>';
    offset+=d.val;
    var pctLbl=total>0?Math.round(d.val/total*100)+'%':'';
    legend+='<div style="display:flex;align-items:center;gap:6px;font-size:11px">'
      +'<div style="width:10px;height:10px;border-radius:3px;background:'+d.color+';flex-shrink:0"></div>'
      +'<span style="color:var(--text2);flex:1">'+d.label+'</span>'
      +'<span style="font-weight:700;color:var(--text1)">'+pctLbl+'</span>'
      +'</div>';
  });
  legend+='</div>';
  return '<div style="background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)">'
    +'<div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:0;margin-bottom:12px">Распределение средств</div>'
    +'<div style="display:flex;align-items:center;gap:16px">'
    +'<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="flex-shrink:0">'+paths+'</svg>'
    +legend
    +'</div>'
    +'</div>';
}

async function downloadAnalyticsPng(){
  var el=document.getElementById('analytics-report');
  if(!el){toast('Нет данных');return;}
  if(typeof html2canvas==='undefined'){toast('html2canvas не загружен');return;}
  toast('Создаём изображение...');
  var r=getAnalyticsRange();
  var name='analytics_'+(new Date(r.start.getTime()-r.start.getTimezoneOffset()*60000)).toISOString().slice(0,10)+'.png';
  try{
    var canvas=await html2canvas(el,{backgroundColor:'var(--bg)',scale:2,useCORS:true,logging:false});
    var a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download=name;a.click();
    toast('PNG сохранён ✓');
  }catch(e){toast('Ошибка экспорта: '+e.message);}
}

function exportAnalyticsCsv(){
  var closed=getClosedPeriodOrders();
  if(!closed.length){toast('Нет закрытых заказов');return;}
  var rows=[['Номер','Клиент','Мастер','Цена','Вес (г)','Кол-во','Вышивка','Материалы','ЗП мастера','ЗП Саши','Настя','Прибыль','Дата закрытия']];
  closed.forEach(function(o){
    var c=calcCosts(o);
    var d=new Date(closedDate(o));
    rows.push([o.num,o.client||'',o.master||'',orderTotal(o),orderWeight(o),orderQty(o),orderEmbCount(o),c.materials,c.master,c.sasha,c.nastya,c.profit,d.toLocaleDateString('ru')]);
  });
  // Итоговая строка с дивидендами Дарьи и чистой прибылью после них
  var totProfit=closed.reduce(function(s,o){return s+calcCosts(o).profit;},0);
  var totDiv=Math.round(Math.max(0,totProfit)*DARYA_DIVIDEND_PCT);
  rows.push([]);
  rows.push(['ИТОГО прибыль до дивидендов','','','','','','','','','','',totProfit,'']);
  rows.push(['Дивиденды Даши (5%)','','','','','','','','','','',totDiv,'']);
  rows.push(['Чистая прибыль после дивидендов','','','','','','','','','','',totProfit-totDiv,'']);
  var csv=rows.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var bom='﻿';
  var blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='analytics_'+analyticsPeriod+'.csv';
  a.click();
  toast('CSV сохранён ✓');
}


function tplPayments(){
  var html='';
  // Сообщение для телеграма после выплаты
  if(window.lastPayout&&((window.lastPayout.advOrders||[]).length||(window.lastPayout.postOrders||[]).length)){
    html+='<div class="card" style="margin-bottom:12px;border:1.5px solid var(--accent)"><div style="padding:12px 14px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
      +'<span style="font-size:11px;color:var(--accent);font-weight:700;letter-spacing:0">✅ Текст для телеграма</span>'
      +'<button onclick="window.lastPayout=null;renderTab(\'payments\')" style="background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;line-height:1">×</button></div>'
      +'<textarea readonly onclick="this.select()" style="width:100%;box-sizing:border-box;min-height:130px;padding:8px 10px;border-radius:8px;font-size:12px;background:var(--bg);color:var(--text1);resize:vertical;font-family:inherit;line-height:1.5">'+esc(buildPayoutMsg(window.lastPayout))+'</textarea>'
      +'<button class="btn btn-sm btn-primary btn-full" style="margin-top:6px;justify-content:center" data-val="'+esc(buildPayoutMsg(window.lastPayout))+'" onclick="copyField(this.dataset.val,this)">📋 Копировать текст</button>'
      +'</div></div>';
  }
  // Блок на каждого мастера, участвующего в выплатах (см. MASTER_CFG.payouts)
  var anyOne=payoutMasters().length===1;
  payoutMasters().forEach(function(mc){
    var m=mc.name;
    // Аванс можно выплачивать пока заказ ещё в процессе (новый / след. неделя / в работе)
    var needAdv=advNeedFor(m);
    var needPost=postNeedFor(m);
    var advDone=orders.filter(function(o){return o.master===m&&o.advancePaid&&!o.postpayPaid&&PAY_POST_STATUSES.indexOf(o.status)<0;});
    var allDone=orders.filter(function(o){return o.master===m&&o.postpayPaid;});
    var advSum=needAdv.reduce(function(s,o){return s+calcAdvance(o);},0);
    var postSum=needPost.reduce(function(s,o){return s+remainingPay(o);},0);
    var grandTotal=advSum+postSum;
    var hasAny=grandTotal>0||advDone.length||allDone.length||advLaterFor(m).length;
    var pct=advPctLbl(m);

    // Заголовок мастера — когда мастер в выплатах один, лишний разделитель не нужен
    if(!anyOne){
      html+='<div style="display:flex;align-items:center;gap:8px;margin:18px 0 10px">'
        +'<div style="width:10px;height:10px;border-radius:50%;background:'+mc.color+'"></div>'
        +'<div style="font-weight:700;letter-spacing:-.4px;font-size:17px;color:var(--accent)">'+m+'</div>'
        +'<div style="flex:1;height:1px;background:var(--border)"></div>'
        +'<div style="font-size:13px;font-weight:700;color:'+(grandTotal>0?'var(--accent)':'var(--text3)')+'">'+(grandTotal>0?fmt(grandTotal):'всё выплачено')+'</div>'
        +'</div>';
    }

    if(grandTotal>0){
      html+='<div class="card" style="margin-bottom:14px"><div style="padding:14px 16px">'
        +(pct>0?'<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--text3)">Авансы · '+STATUSES[ADV_PAY_STATUS].label+' · '+needAdv.length+'</span><span style="font-weight:700">'+fmt(advSum)+'</span></div>':'')
        +'<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid var(--border);margin-bottom:6px"><span style="color:var(--text3)">Готовые · '+needPost.length+'</span><span style="font-weight:700">'+fmt(postSum)+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;font-size:14px;padding:4px 0 10px"><span style="font-weight:700">Итого</span><span style="font-weight:700;letter-spacing:-.4px;font-size:20px;color:var(--accent)">'+fmt(grandTotal)+'</span></div>'
        +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
        +(pct>0?'<button class="btn btn-sm btn-secondary" style="flex:1;min-width:130px;justify-content:center"'+(advSum?'':' disabled')+' onclick="payOnlyAdvances(\''+m+'\')">Только авансы '+fmt(advSum)+'</button>':'')
        +'<button class="btn btn-sm btn-secondary" style="flex:1;min-width:130px;justify-content:center"'+(postSum?'':' disabled')+' onclick="payOnlyPost(\''+m+'\')">Только готовые '+fmt(postSum)+'</button>'
        +'<button class="btn btn-sm btn-primary btn-full" style="justify-content:center" onclick="markAllPayments(\''+m+'\')">Выплатить всё '+fmt(grandTotal)+'</button>'
        +'</div></div></div>';
    }

    if(pct>0){
      html+='<div class="section-lbl">Авансы · '+STATUSES[ADV_PAY_STATUS].label+' — '+needAdv.length+'</div>';
      if(!needAdv.length)html+='<div class="empty" style="padding:12px 0"><div style="font-size:20px">✓</div>Авансов к выплате нет</div>';
      else needAdv.forEach(function(o){html+=payRow(o,'advance');});
      // Заказы, по которым аванс возможен, но неделя ещё не подошла
      var later=advLaterFor(m);
      if(later.length){
        var laterSum=later.reduce(function(s2,o){return s2+calcAdvance(o);},0);
        html+='<div class="section-lbl" style="margin-top:14px">Аванс позже · другие статусы — '+later.length+' · '+fmt(laterSum)+'</div>'
          +'<div style="font-size:11px;color:var(--text3);margin:-4px 0 8px">Не входят в сводку и в кнопку «Только авансы». Выплатить можно по одному.</div>';
        later.forEach(function(o){html+=payRow(o,'advance');});
      }
    }

    html+='<div class="section-lbl" style="margin-top:16px">'+(pct>0?'Доплаты':'Выплаты')+' (готовы) — '+needPost.length+'</div>';
    if(!needPost.length)html+='<div class="empty" style="padding:12px 0"><div style="font-size:20px">✓</div>Всё выплачено</div>';
    else needPost.forEach(function(o){html+=payRow(o,'postpay');});

    // Забытые долги: заказ с невыплаченными деньгами, выпавший из всех статусов (например «Архив»)
    var lost=orders.filter(function(o){return o.master===m&&remainingPay(o)>0&&PAY_ADV_STATUSES.indexOf(o.status)<0&&PAY_POST_STATUSES.indexOf(o.status)<0;});
    if(lost.length){
      html+='<div class="section-lbl" style="margin-top:16px;color:var(--red-ink)">⚠️ Не выплачено (архив/прочее) — '+lost.length+'</div>';
      lost.forEach(function(o){html+=payRow(o,'postpay');});
    }
    if(advDone.length){
      html+='<div class="section-lbl" style="margin-top:16px">Аванс выплачен, ждём готовности — '+advDone.length+'</div>';
      advDone.forEach(function(o){html+=payRow(o,'adv-done');});
    }
    if(allDone.length){
      html+='<div class="section-lbl" style="margin-top:16px">Полностью выплачено — '+allDone.length+'</div>';
      allDone.forEach(function(o){html+=payRow(o,'pay-done');});
    }
    if(!hasAny)html+='<div class="empty" style="padding:16px 0">Заказов нет</div>';
  });
  return html;
}

function payRow(o,type){
  var total=calcMasterPay(o);
  var adv=calcAdvance(o);
  var post=calcPostpay(o);
  var wInfo=orderWeight(o)?orderWeight(o)+'г':'—';
  var eInfo=orderEmbCount(o)?' + вышивка ×'+orderEmbCount(o):'';
  var info='<div style="font-size:12px;color:var(--text3);margin-bottom:8px">'+orderToyLabel(o)+' · '+wInfo+eInfo+' · '+moLbl(o.month)+'</div>';
  var head='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
    +'<span class="card-num">'+o.num+'</span>'
    +'<span style="font-size:12px;font-weight:600;color:var(--text2)">'+o.master+'</span>'
    +'<span class="badge '+(STATUSES[o.status]||STATUSES.new).cls+'">'+(STATUSES[o.status]||STATUSES.new).label+'</span>'
    +'</div>';
  var oid=o.id;
  var btnAdv='<button class="btn btn-sm btn-primary" data-id="'+oid+'" data-type="advance" onclick="markPayBtn(this)">Выплатить аванс '+fmt(adv)+'</button>';
  var btnPost='<button class="btn btn-sm btn-primary" data-id="'+oid+'" data-type="postpay" onclick="markPayBtn(this)">Выплатить '+fmt(post)+'</button>';
  var btnUndoAdv='<button class="btn btn-sm" style="background:var(--red-bg);color:var(--red-ink);border:1px solid var(--red);padding:3px 8px;font-size:11px" data-id="'+oid+'" data-type="advance" onclick="undoPayBtn(this)">Отменить</button>';
  var btnUndoPost='<button class="btn btn-sm" style="background:var(--red-bg);color:var(--red-ink);border:1px solid var(--red);padding:3px 8px;font-size:11px" data-id="'+oid+'" data-type="postpay" onclick="undoPayBtn(this)">Отменить</button>';
  var body='';
  if(type==='advance'){
    var apct=advPctLbl(o.master);
    var pLbl=apct>0?('Доплата ('+(100-apct)+'%)'):'Выплата';
    body='<div class="pay-row"><span style="color:var(--text3)">ЗП итого</span><span style="font-weight:700">'+fmt(total)+'</span></div>'
      +'<div class="pay-row"><span style="color:var(--text3)">Аванс ('+apct+'%)</span><span style="font-weight:700;color:var(--accent)">'+fmt(adv)+'</span></div>'
      +'<div class="pay-row"><span style="color:var(--text3)">'+pLbl+'</span><span style="font-weight:700;color:var(--text2)">'+fmt(post)+'</span></div>'
      +'<div style="margin-top:10px">'+btnAdv+'</div>';
  }else if(type==='postpay'){
    var rem=remainingPay(o);
    var btnPostFull='<button class="btn btn-sm btn-primary" data-id="'+oid+'" data-type="postpay" onclick="markPayBtn(this)">Выплатить '+fmt(rem)+'</button>';
    body='<div class="pay-row"><span style="color:var(--text3)">ЗП итого</span><span style="font-weight:700">'+fmt(total)+'</span></div>'
      +(o.advancePaid
        ? '<div class="pay-row"><span style="color:var(--text3)">Аванс выплачен</span><span style="color:var(--green-ink)">'+fmt(adv)+' ✓</span></div>'
          +'<div class="pay-row"><span style="color:var(--text3)">Доплата ('+(100-advPctLbl(o.master))+'%)</span><span style="font-weight:700;color:var(--accent)">'+fmt(post)+'</span></div>'
        : '<div class="pay-row"><span style="color:var(--text3)">Аванс ('+advPctLbl(o.master)+'%) — не выплачен</span><span style="font-weight:700;color:var(--orange-ink)">'+fmt(adv)+'</span></div>'
          +'<div class="pay-row"><span style="color:var(--text3)">Доплата ('+(100-advPctLbl(o.master))+'%)</span><span style="font-weight:700;color:var(--accent)">'+fmt(post)+'</span></div>'
          +'<div class="pay-row" style="border-top:1px solid var(--border2)"><span style="color:var(--text2);font-weight:700">К выплате (аванс + доплата)</span><span style="font-weight:700;color:var(--accent)">'+fmt(rem)+'</span></div>')
      +'<div style="margin-top:10px">'+btnPostFull+'</div>';
  }else if(type==='adv-done'){
    body='<div class="pay-row" style="justify-content:space-between">'
      +'<span style="color:var(--green-ink)">Аванс '+fmt(adv)+' выплачен ✓</span>'
      +btnUndoAdv+'</div>'
      +'<div class="pay-row"><span style="color:var(--text3)">Остаток после готовности</span><span style="font-weight:700">'+fmt(post)+'</span></div>';
  }else if(type==='pay-done'){
    body='<div class="pay-row" style="justify-content:space-between">'
      +'<span style="color:var(--green-ink)">Полностью выплачено '+fmt(total)+' ✓</span>'
      +btnUndoPost+'</div>';
  }
  return '<div class="card" style="margin-bottom:8px"><div style="padding:12px 14px">'+head+info+body+'</div></div>';

function calcZpTable(weightG,embCount){
  var w=parseFloat(weightG)||0;
  var base;
  if(w<1900)base=2300;
  else if(w<2500)base=2500;
  else if(w<3000)base=2700;
  else if(w<3400)base=2800;
  else if(w<3800)base=2900;
  else if(w<4400)base=3100;
  else if(w<=5500)base=3400;
  else base=Math.floor((1800+w*0.3)/100)*100;
  return base+(parseInt(embCount)||0)*400;
}
function calcMasterPay(o){
  // Сумма ЗП по всем игрушкам заказа
  return getItems(o).reduce(function(s,it){return s+calcItemMasterPay(it,o.master);},0);
}
function calcAdvance(o){
  var pct=masterCfg(o.master).advancePct||0;
  return pct>0?Math.round(calcMasterPay(o)*pct):0;
}
function calcPostpay(o){return calcMasterPay(o)-calcAdvance(o);}
// Доля аванса мастера в процентах — для подписей в интерфейсе
function advPctLbl(master){return Math.round((masterCfg(master).advancePct||0)*100);}
// Остаток к выплате мастеру: невыплаченный аванс + невыплаченная доплата
function remainingPay(o){
  return (o.advancePaid?0:calcAdvance(o))+(o.postpayPaid?0:calcPostpay(o));
}

function tplSvetaFinance(){
  var now=new Date();
  var sf=window.svetaPeriod||'week';
  var svetaWkOff=window.svetaWkOff||0;
  var svetaMon=window.svetaMon||'';

  // ── Вычисляем диапазон ──
  var rangeStart=null,rangeEnd=null,rangeLabel='';
  if(sf==='week'){
    // Понедельник текущей/смещённой недели
    var ws=new Date(now);
    ws.setDate(now.getDate()-((now.getDay()||7)-1)+svetaWkOff*7);
    ws.setHours(0,0,0,0);
    var we=new Date(ws);we.setDate(ws.getDate()+6);we.setHours(23,59,59,999);
    rangeStart=ws;rangeEnd=we;
    var opts={day:'numeric',month:'short'};
    rangeLabel=ws.toLocaleDateString('ru',opts)+' – '+we.toLocaleDateString('ru',opts);
  } else if(sf==='month'&&svetaMon){
    var p=svetaMon.split('-').map(Number);
    rangeStart=new Date(p[0],p[1]-1,1,0,0,0,0);
    rangeEnd=new Date(p[0],p[1],0,23,59,59,999);
    rangeLabel=moLbl(svetaMon);
  }

  function inPeriod(o){
    if(!rangeStart)return true; // «Всё время»
    var d=new Date(isClosed(o)?closedDate(o):o.created);
    return d>=rangeStart&&d<=rangeEnd;
  }

  // Только свои заказы: раньше здесь было жёстко 'Света', из-за чего любой
  // мастер видел её заказы и заработок.
  var myAll=orders.filter(function(o){return o.master===masterName;});
  var myOrders=myAll.filter(inPeriod);

  // «В работе» — только статус 'work', без учёта периода
  var inWorkOrds=myAll.filter(function(o){return o.status==='work';});
  var inWork=inWorkOrds.length;
  var done=myOrders.filter(function(o){return isClosed(o);}).length;
  var closedOrds=myOrders.filter(function(o){return isClosed(o);});

  var totalGot=myOrders.reduce(function(s,o){
    return s+(o.advancePaid?calcAdvance(o):0)+(o.postpayPaid?calcPostpay(o):0);
  },0);
  // «Ожидается» — невыплаченное по всем заказам в работе/готов/планируется (без фильтра по периоду)
  var pendingOrds=myAll.filter(function(o){return o.status==='work'||o.status==='ready'||o.status==='planned';});
  var totalPending=pendingOrds.reduce(function(s,o){
    return s+(!o.advancePaid?calcAdvance(o):0)+(!o.postpayPaid?calcPostpay(o):0);
  },0);

  // ── Переключатели периода ──
  var html='<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">';
  [{id:'week',label:'Неделя'},{id:'month',label:'Месяц'},{id:'all',label:'Всё время'}].forEach(function(p){
    var isAct=sf===p.id;
    html+='<button class="chip'+(isAct?' active':'')+'" onclick="window.svetaPeriod=\''+p.id+'\';window.svetaWkOff=0;renderTab(\'finance\')">'+p.label+'</button>';
  });
  html+='</div>';

  // Навигация по неделям
  if(sf==='week'){
    var isCurrentWeek=svetaWkOff===0;
    html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
      +'<button class="btn btn-sm btn-secondary" onclick="window.svetaWkOff='+(svetaWkOff-1)+';renderTab(\'finance\')">← Пред.</button>'
      +'<div style="font-size:12px;color:var(--text2);font-weight:600;text-align:center">'+rangeLabel+(isCurrentWeek?' <span style="font-size:10px;color:var(--text3)">(эта неделя)</span>':'')+'</div>'
      +'<button class="btn btn-sm btn-secondary" '+(isCurrentWeek?'disabled style="opacity:.4"':' onclick="window.svetaWkOff='+(svetaWkOff+1)+';renderTab(\'finance\')"')+'>След. →</button>'
      +'</div>';
  }

  // Выбор месяца
  if(sf==='month'){
    var months=[...new Set(myAll.map(function(o){return o.month;}).filter(Boolean))].sort().reverse();
    if(!svetaMon&&months.length)svetaMon=window.svetaMon=months[0];
    html+='<div class="filters" style="margin-bottom:12px">';
    months.forEach(function(m){
      html+='<button class="chip'+(svetaMon===m?' active':'')+'" onclick="window.svetaMon=\''+m+'\';renderTab(\'finance\')">'+moLbl(m)+'</button>';
    });
    html+='</div>';
  }

  // ── Карточки итогов ──
  html+='<div class="stats-grid" style="margin-bottom:12px">'
    +'<div class="stat-card"><div class="stat-val" style="color:var(--green-ink)">'+fmt(totalGot)+'</div><div class="stat-lbl">Получено'+(rangeLabel?' за период':'')+'</div></div>'
    +'<div class="stat-card"><div class="stat-val" style="color:var(--orange-ink)">'+fmt(totalPending)+'</div><div class="stat-lbl">Ожидается</div></div>'
    +'</div>';

  // ── Раскрывающиеся группы заказов ──
  var sfwOpen=window.svetaFwOpen||{};

  function ordMiniRow(o){
    var toy=orderToyLabel(o);
    var mo=moLbl(o.month);
    return '<div onclick="jumpTo(\''+o.id+'\')" style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer" onmouseenter="this.style.background=\'var(--accent-bg)\'" onmouseleave="this.style.background=\'\'">'
      +'<span style="font-weight:800;color:var(--accent);font-size:13px;min-width:44px">'+o.num+'</span>'
      +(toy?'<span style="font-size:11px;font-weight:700;color:var(--accent2);background:var(--accent-bg);padding:1px 6px;border-radius:6px">'+toy+'</span>':'')
      +'<span style="font-size:12px;color:var(--text3);flex:1">'+mo+'</span>'
      +'<span class="badge '+(STATUSES[o.status]||STATUSES.new).cls+'" style="font-size:10px">'+(STATUSES[o.status]||STATUSES.new).label+'</span>'
      +'</div>';
  }

  html+='<div style="background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)">';
  // В работе сейчас
  html+='<div onclick="window.svetaFwOpen=window.svetaFwOpen||{};window.svetaFwOpen.work=!window.svetaFwOpen.work;renderTab(\'finance\')" style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border);cursor:pointer;user-select:none">'
    +'<span style="color:var(--text3)">В работе сейчас</span>'
    +'<span style="font-weight:700">'+inWork+' '+pluralZakaz(inWork)+(inWork?' '+(sfwOpen.work?'▴':'▾'):'')+'</span>'
    +'</div>';
  if(sfwOpen.work&&inWorkOrds.length){
    html+='<div style="padding:0 2px">';
    inWorkOrds.sort(function(a,b){return (a.num||'').localeCompare(b.num||'');}).forEach(function(o){html+=ordMiniRow(o);});
    html+='</div>';
  }
  // Закрыто за период
  html+='<div onclick="window.svetaFwOpen=window.svetaFwOpen||{};window.svetaFwOpen.closed=!window.svetaFwOpen.closed;renderTab(\'finance\')" style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;cursor:pointer;user-select:none;margin-top:'+(sfwOpen.work&&inWorkOrds.length?'0':'4px')+'">'
    +'<span style="color:var(--text3)">Закрыто за период</span>'
    +'<span style="font-weight:700;color:var(--green-ink)">'+done+' '+pluralZakaz(done)+(done?' '+(sfwOpen.closed?'▴':'▾'):'')+'</span>'
    +'</div>';
  if(sfwOpen.closed&&closedOrds.length){
    html+='<div style="padding:0 2px">';
    closedOrds.sort(function(a,b){return (a.num||'').localeCompare(b.num||'');}).forEach(function(o){html+=ordMiniRow(o);});
    html+='</div>';
  }
  html+='</div>';

  html+='<div class="section-lbl">История заказов'+(rangeLabel?' · '+rangeLabel:'')+'</div>';
  if(!myOrders.length){html+='<div class="empty"><div class="empty-icon">🧸</div>Нет заказов за период</div>';}
  myOrders.slice().sort(function(a,b){return b.created-a.created;}).forEach(function(o){
    var total=calcMasterPay(o),adv=calcAdvance(o),post=calcPostpay(o);
    var wInfo=orderWeight(o)?orderWeight(o)+'г':'—';
    html+='<div style="background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:var(--sh)">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
      +'<span style="font-family:serif;font-size:14px;color:var(--accent);font-weight:600">'+o.num+'</span>'
      +'<span class="badge '+(STATUSES[o.status]||STATUSES.new).cls+'">'+(STATUSES[o.status]||STATUSES.new).label+'</span>'
      +(isClosed(o)?' <span class="badge" style="background:var(--green-bg);color:var(--green-ink)">🔒 Закрыт</span>':'')
      +'</div>'
      +'<div style="font-size:12px;color:var(--text3);margin-bottom:8px">'+orderToyLabel(o)+' · '+wInfo+' · '+moLbl(o.month)+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px">'
      +'<div><div style="color:var(--text3)">ЗП итого</div><div style="font-weight:700">'+fmt(total)+'</div></div>'
      +'<div><div style="color:var(--text3)">Получено</div><div style="font-weight:700;color:var(--green-ink)">'+fmt((o.advancePaid?adv:0)+(o.postpayPaid?post:0))+'</div></div>'
      +'<div><div style="color:var(--text3)">Ожидается</div><div style="font-weight:700;color:var(--orange-ink)">'+fmt((!o.advancePaid?adv:0)+(!o.postpayPaid?post:0))+'</div></div>'
      +'</div></div>';
  });
  return html;
}

function tplTasks(){
  // Видимость: личные задачи (to=мое имя) видны только мне; остальное видят только Саша/Даша
  const me=myTaskName();
  const visible=tasks.filter(function(t){
    if(t.to===me) return true; // личные видны только мне
    return role!=='master'; // остальное видят только Саша/Даша
  });
  const open=visible.filter(function(t){return!t.done;}).sort(function(a,b){return b.created-a.created;});
  const done=visible.filter(function(t){return t.done;}).sort(function(a,b){return b.created-a.created;}).slice(0,15);
  // Куда можно назначить задачу
  var toList;
  // Список людей строится из USERS, поэтому новый мастер появляется здесь сам
  var officeNames=USERS.filter(function(u){return u.role!=='master';}).map(function(u){return u.name;});
  var masterNames=USERS.filter(function(u){return u.role==='master';}).map(function(u){return u.name;});
  if(role==='master'){
    // Мастер пишет только в офис — переписку мастеров между собой не открываем
    toList=[['Мне','Мне (только я вижу)']].concat(officeNames.map(function(n){return [n,n];}));
  }else{
    var others=officeNames.filter(function(n){return n!==me;}).concat(masterNames.filter(function(n){return n!==me;}));
    toList=[['Мне','Мне (только я вижу)']]
      .concat(others.map(function(n){return [n,n];}))
      .concat([['all',officeNames.join(' и ')]]);
  }
  // выбранный получатель (по умолчанию — первый допустимый)
  var allowed=toList.map(function(p){return p[0];});
  if(allowed.indexOf(window.taskTo)<0)window.taskTo=allowed[0];
  var chips=toList.map(function(p){
    var c=personPastelColor(p[0]);
    var active=window.taskTo===p[0];
    // Текст всегда тёмный: пастельные подложки слишком светлые для белого (давало 1.3:1)
    return '<button type="button" data-to="'+p[0]+'" data-color="'+c+'" onclick="selectTaskTo(this)" '
      +'style="font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;border:1.5px solid '+c+';background:'+(active?c:c+'26')+';color:var(--text1)">'+p[1]+'</button>';
  }).join('');

  let html='<div class="form-section" style="margin-bottom:12px;padding:12px 14px">'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">'+chips+'</div>'
    +'<div style="display:flex;gap:8px">'
    +'<input id="task-text" placeholder="Новая задача..." onkeydown="if(event.key===\'Enter\')addTask()" style="flex:1;padding:9px 12px;border-radius:10px;font-size:14px;background:var(--bg);font-family:inherit;outline:none">'
    +'<button class="btn btn-primary" onclick="addTask()" style="padding:9px 16px;flex-shrink:0">Добавить</button>'
    +'</div>'
    +'</div>';

  if(open.length===0&&done.length===0){html+='<div class="empty" style="text-align:center;padding:24px 14px;color:var(--text3);font-size:13px">Задач нет</div>';}
  if(open.length>0){
    html+='<div class="section-lbl">Открытые · '+open.length+'</div>';
    open.forEach(function(t){html+=taskCard(t);});
  }
  if(done.length>0){
    html+='<div class="section-lbl" style="margin-top:14px">Выполненные</div>';
    done.forEach(function(t){html+=taskCard(t);});
  }
  return html;
}

function personColor(name){
  var fixed={'Александра':'#E9BE58','all':'#3967E8'}[name];
  if(fixed)return fixed;
  // Мастера окрашиваются своим цветом из справочника
  for(var i=0;i<MASTER_CFG.length;i++){if(MASTER_CFG[i].name===name)return MASTER_CFG[i].color;}
  return 'var(--accent)';
}
function personPastelColor(name){
  var fixed={'Мне':'#F6E48C','Александра':'#F3DFA8','all':'#AFC6F5'}[name];
  if(fixed)return fixed;
  for(var i=0;i<MASTER_CFG.length;i++){if(MASTER_CFG[i].name===name)return MASTER_CFG[i].color+'99';}
  return '#D9D4C8';   // запасной пастельный для неизвестного имени
}
// Имя текущего пользователя в системе задач
function myTaskName(){return role==='master'?masterName:(role==='manager'?'Александра':'Даша');}
// Кол-во новых задач для меня (не выполненных, не моих, появившихся после последнего просмотра)
function unreadTaskCount(){
  if(!role)return 0;
  var me=myTaskName();
  var seen=0;try{seen=parseInt(localStorage.getItem('tasks_seen_'+me))||0;}catch(e){}
  return tasks.filter(function(t){
    if(t.done||t.from===me)return false;
    var forMe=t.to===me||(t.to==='all'&&role!=='master');
    return forMe&&(t.created>seen);
  }).length;
}
function markTasksSeen(){
  try{localStorage.setItem('tasks_seen_'+myTaskName(),Date.now());}catch(e){}
}
function unreadOrderCount(){
  if(!role)return 0;
  var key='orders_seen_'+role+(role==='master'?'_'+masterName:'');
  var seen=0;try{seen=parseInt(localStorage.getItem(key))||0;}catch(e){}
  return orders.filter(function(o){
    if(o.status==='archived'||o.status==='done'||o.status==='sent')return false;

// ═══════════════════════════════════════════════════════════════════
//  МОДУЛЬ «БАНК» — фактическое движение денег
//  Доступ: только manager (Александра) и director (Дарья). Мастеру закрыт.
//
//  Хранение: таблица Supabase `finance`, строки вида {id, data:jsonb}.
//  В одной таблице два типа записей, различаются по полю data.kind:
//    kind:'account' — счёт   {id,kind,name,type:'bank'|'savings',startBalance,startDate,ord,archived}
//    kind:'tx'      — операция {id,kind,date,type:'income'|'expense'|'transfer',amount,
//                               accountId,toAccountId,category,merchant,comment,
//                               direction:'toys'|'mk',orderId,author,source,created}
//
//  ВАЖНО: баланс нигде не хранится полем — он всегда пересчитывается из
//  начального остатка счёта и операций. Иначе при параллельной работе
//  Александры и Дарьи цифры разъедутся.
// ═══════════════════════════════════════════════════════════════════

// Направления учёта. МК (мастер-классы) — отдельное направление: деньги лежат
// физически на счёте (обычно Озон), но в «общий котёл» игрушек не входят.
const BANK_DIRS=[{id:'toys',label:'Игрушки'},{id:'mk',label:'Мастер-классы'}];
const DIR_LBL={toys:'Игрушки',mk:'МК'};

const INCOME_CATS=['Предоплата заказа','Доплата заказа','Продажа МК','Возврат/компенсация','Прочий доход'];
// Категории ЗП собираются из справочника мастеров, чтобы новый мастер сразу
// появился в списке. Старые операции с прежними названиями категорий не ломаются.
const EXPENSE_CATS=['Материалы','Гранулят','Одежда (Настя)']
  .concat(MASTERS.map(function(m){return 'ЗП '+m;}))
  .concat(['ЗП Александра','Дивиденды/выводы','Доставка/СДЭК','Упаковка и полиграфия','Сервисы','Налоги','Прочее']);
const TRANSFER_CATS=['Между счетами','Пополнение вклада','Снятие с вклада'];

// Счета, которые создаются при первом открытии раздела
const DEFAULT_ACCOUNTS=[
  {name:'Озон Банк',    type:'bank'},
  {name:'Сбербанк',     type:'bank'},
  {name:'Вклад Сбербанк',type:'savings'},
];

// Состояние экрана
var bankPeriod='month';     // 'week' | 'month' | 'all'
var bankMonthKey='';        // выбранный месяц YYYY-MM
var bankFilterAcc='all';
var bankFilterDir='all';
var bankAiDraft=null;       // распознанные ИИ операции, ждущие подтверждения

function canSeeBank(){return role==='manager'||role==='director';}
function bankAuthor(){return role==='director'?'Даша':(role==='manager'?'Александра':'—');}

// ── Выборки ──
function bankAccounts(){
  return finance.filter(function(r){return r&&r.kind==='account'&&!r.archived;})
    .sort(function(a,b){return (a.ord||0)-(b.ord||0);});
}
function bankTxAll(){
  return finance.filter(function(r){return r&&r.kind==='tx';})
    .sort(function(a,b){
      if(a.date!==b.date)return a.date<b.date?1:-1;   // новые сверху
      return (b.created||0)-(a.created||0);
    });
}
function accById(id){return finance.find(function(r){return r&&r.kind==='account'&&r.id===id;});}
function accName(id){var a=accById(id);return a?a.name:'—';}

// ── Балансы ──
// Физический баланс счёта: начальный остаток + все операции по нему (включая МК).
function accBalance(accId){
  var a=accById(accId);
  if(!a)return 0;
  var bal=parseFloat(a.startBalance)||0;
  bankTxAll().forEach(function(t){
    var amt=parseFloat(t.amount)||0;
    if(t.type==='income'&&t.accountId===accId)bal+=amt;
    else if(t.type==='expense'&&t.accountId===accId)bal-=amt;
    else if(t.type==='transfer'){
      if(t.accountId===accId)bal-=amt;
      if(t.toAccountId===accId)bal+=amt;
    }
  });
  return bal;
}
// Сальдо направления: доходы минус расходы. Переводы между своими счетами
// направление не меняют, поэтому в расчёт не идут.
function dirBalance(dir){
  return bankTxAll().reduce(function(s,t){
    if((t.direction||'toys')!==dir)return s;
    var amt=parseFloat(t.amount)||0;
    if(t.type==='income')return s+amt;
    if(t.type==='expense')return s-amt;
    return s;
  },0);
}
function bankTotals(){
  var accs=bankAccounts();
  var phys=accs.reduce(function(s,a){return s+accBalance(a.id);},0);
  var liquid=accs.filter(function(a){return a.type!=='savings';})
                 .reduce(function(s,a){return s+accBalance(a.id);},0);
  var mk=dirBalance('mk');
  return {
    phys:phys,          // сколько денег физически на всех счетах
    mk:mk,              // из них относится к направлению МК
    pot:phys-mk,        // общий котёл игрушек (МК исключён)
    spendable:liquid-mk // доступно к трате: без вклада и без денег МК
  };
}

// ── Периоды ──
function bankRange(){
  var now=new Date();
  if(bankPeriod==='week'){
    var r=getWeekRange();
    return {start:r.start,end:r.end,label:'Текущая неделя'};
  }
  if(bankPeriod==='month'){
    var key=bankMonthKey||(now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
    var p=key.split('-');
    var s=new Date(+p[0],+p[1]-1,1,0,0,0,0);
    var e=new Date(+p[0],+p[1],0,23,59,59,999);
    return {start:s,end:e,label:moLbl(key),monthKey:key};
  }
  return {start:new Date(2000,0,1),end:new Date(2999,0,1),label:'Всё время'};
}
function bankPeriodTx(){
  var r=bankRange();
  return bankTxAll().filter(function(t){
    var d=new Date(t.date+'T12:00:00');
    if(d<r.start||d>r.end)return false;
    if(bankFilterAcc!=='all'&&t.accountId!==bankFilterAcc&&t.toAccountId!==bankFilterAcc)return false;
    if(bankFilterDir!=='all'&&(t.direction||'toys')!==bankFilterDir)return false;
    return true;
  });
}
function setBankPeriod(p){bankPeriod=p;if(p!=='month')bankMonthKey='';renderTab('bank');}
function setBankMonth(m){bankMonthKey=m;bankPeriod='month';renderTab('bank');}
function setBankAcc(id){bankFilterAcc=id;renderTab('bank');}
function setBankDir(d){bankFilterDir=d;renderTab('bank');}

function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dLbl(iso){
  if(!iso)return '';
  var p=iso.split('-');
  return p[2]+'.'+p[1];
}

function txRow(t){
  var isInc=t.type==='income',isTr=t.type==='transfer';
  var sign=isTr?'⇄':(isInc?'+':'−');
  var color=isTr?'var(--blue-ink)':(isInc?'var(--green-ink)':'var(--red-ink)');
  var where=isTr?(accName(t.accountId)+' → '+accName(t.toAccountId)):accName(t.accountId);
  var meta=[dLbl(t.date),where];
  if((t.direction||'toys')==='mk')meta.push('МК');

      +'<div style="font-size:10px;color:var(--text3);margin-top:2px">'+meta.join(' · ')+'</div>'

function tplBankByCategory(list){
  var exp=list.filter(function(t){return t.type==='expense';});
  if(!exp.length)return '';
  var by={};
  exp.forEach(function(t){var c=t.category||'Прочее';by[c]=(by[c]||0)+(parseFloat(t.amount)||0);});
  var rows=Object.keys(by).map(function(c){return {c:c,v:by[c]};}).sort(function(a,b){return b.v-a.v;});
  var tot=rows.reduce(function(s,r){return s+r.v;},0);
  var html='<div class="card" style="padding:14px;margin-top:14px">'
    +'<div class="section-lbl" style="margin-bottom:10px">Расходы по категориям</div>';
  rows.forEach(function(r){
    var p=tot>0?Math.round(r.v/tot*100):0;
    html+='<div style="margin-bottom:8px">'
      +'<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:3px"><span>'+r.c+'</span><span style="font-weight:700">'+fmt(r.v)+' · '+p+'%</span></div>'
      +'<div style="height:6px;background:var(--bg2);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+p+'%;background:var(--accent)"></div></div>'
      +'</div>';
  });
  html+='</div>';
  return html;
}

// Сверка: расчётная прибыль по закрытым заказам против фактического денежного потока.
// Расхождение — не ошибка, а сигнал: либо забыли внести операцию, либо формула
// себестоимости разошлась с реальностью.
function tplBankReconcile(list){
  var r=bankRange();
  var closed=orders.filter(function(o){
    if(!isClosed(o))return false;
    var d=new Date(closedDate(o));
    return d>=r.start&&d<=r.end;
  });
  if(!closed.length)return '';
  var calcProfit=closed.reduce(function(s,o){return s+calcCosts(o).profit;},0);
  var toysTx=list.filter(function(t){return (t.direction||'toys')==='toys';});
  var factInc=toysTx.filter(function(t){return t.type==='income';}).reduce(function(s,t){return s+(parseFloat(t.amount)||0);},0);
  var factExp=toysTx.filter(function(t){return t.type==='expense';}).reduce(function(s,t){return s+(parseFloat(t.amount)||0);},0);
  var factFlow=factInc-factExp;
  var diff=factFlow-calcProfit;
  return '<div class="card" style="padding:14px;margin-top:10px">'
    +'<div class="section-lbl" style="margin-bottom:10px">Сверка с заказами · '+r.label+'</div>'
    +'<div class="pay-row" style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0"><span style="color:var(--text2)">Расчётная прибыль ('+closed.length+' закр. зак.)</span><span style="font-weight:700">'+fmt(calcProfit)+'</span></div>'
    +'<div class="pay-row" style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0"><span style="color:var(--text2)">Фактический поток (игрушки)</span><span style="font-weight:700">'+fmt(factFlow)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;padding:6px 0 0;border-top:1px solid var(--border2);margin-top:4px"><span style="color:var(--text2);font-weight:700">Расхождение</span><span style="font-weight:700;color:'+(Math.abs(diff)<1000?'var(--green-ink)':'var(--orange-ink)')+'">'+fmt(diff)+'</span></div>'
    +'<div style="font-size:10px;color:var(--text3);margin-top:6px;line-height:1.5">Расчёт — по формуле себестоимости из заказов. Факт — по внесённым операциям. Разница обычно означает неучтённую операцию или оплату, прошедшую в другом периоде.</div>'
    +'</div>';
}

function bankCatsFor(type){
  if(type==='income')return INCOME_CATS;

function editAiDraft(i,field,val){
  if(!bankAiDraft||!bankAiDraft[i])return;

}
function dropAiDraft(i){
  bankAiDraft.splice(i,1);

}

async function parseFinanceWithAI(){
  var text=document.getElementById('fin-ai-input').value.trim();
  if(!text){toast('Опишите операцию');return;}
  var accs=bankAccounts();
  var btn=document.getElementById('fin-ai-btn');
  btn.disabled=true;btn.textContent='Анализирую...';
  var prompt='Ты финансовый ассистент мастерской мягких игрушек «Марковка». Сегодня '+todayISO()+'.\n'
    +'Извлеки из текста ВСЕ денежные операции и верни ТОЛЬКО JSON-массив без пояснений и без markdown.\n'
    +'Формат элемента:\n'
    +'{\n'
    +'  "type": "income" | "expense" | "transfer",\n'
    +'  "amount": число (только положительное),\n'
    +'  "date": "YYYY-MM-DD" (если не указана — сегодня; «вчера»/«позавчера» посчитай от сегодняшней даты),\n'
    +'  "account": "название счёта откуда/куда идут деньги — строго одно из: '+accs.map(function(a){return a.name;}).join(' | ')+'",\n'
    +'  "toAccount": "только для type=transfer — счёт-получатель из того же списка, иначе пустая строка",\n'
    +'  "category": "строго одно значение из списка ниже",\n'
    +'  "direction": "toys" или "mk",\n'
    +'  "merchant": "у кого купили / от кого пришло, свободный текст, или пустая строка",\n'
    +'  "orderNum": "номер заказа вида М-015, если упомянут, иначе пустая строка"\n'
    +'}\n'
    +'Категории для income: '+INCOME_CATS.join(' | ')+'\n'
    +'Категории для expense: '+EXPENSE_CATS.join(' | ')+'\n'
    +'Категории для transfer: '+TRANSFER_CATS.join(' | ')+'\n'
    +'\nПРАВИЛА:\n'
    +'1. Категорию БЕРИ ТОЛЬКО из списка. Ничего не выдумывай. Не подходит — ставь «Прочее» (или «Прочий доход»), а исходные слова положи в merchant.\n'
    +'2. Различай счёт и продавца: «с озон», «с озон банка», «озоном» = счёт «Озон Банк». «с Озона», «на Озоне», «заказала на озоне» = маркетплейс Ozon, это merchant, а счёт определи из остального текста (по умолчанию «Озон Банк»).\n'
    +'3. direction="mk" ставь ТОЛЬКО если речь о мастер-классе (МК, мастер-класс, обучение, ученица, набор для МК). Во всех остальных случаях "toys".\n'
    +'4. Наполнитель, холлофайбер, гранулят, пеллетс — категория «Гранулят». Мех, ткань, фурнитура, глазки, нитки — «Материалы».\n'
    +'5. Перевод на вклад / отложили / накопления = type "transfer", category «Пополнение вклада», toAccount «Вклад Сбербанк». Это НЕ расход.\n'
    +'6. Выплата мастеру = «ЗП <имя>» ('+MASTERS.map(function(m){return 'ЗП '+m;}).join(', ')+'), Александре = «ЗП Александра», Насте за одежду = «Одежда (Настя)».\n'
    +'7. Если операций несколько — верни несколько элементов массива.\n'
    +'\nТекст:\n'+text;
  try{
    var r=await fetch(OPENROUTER_PROXY,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'google/gemini-2.5-flash',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    if(!r.ok){
      // Тело ошибки может быть не JSON (воркер отдаёт текст) — читаем как текст,
      // иначе разбор JSON падает и настоящая причина теряется.
      var body='';
      try{body=await r.text();}catch(e0){}
      var msg='';
      try{var j=JSON.parse(body);msg=(j.error&&(j.error.message||j.error))||'';}catch(e0){msg=body.slice(0,200);}
      console.error('Finance AI HTTP '+r.status,body);
      throw new Error('HTTP '+r.status+(msg?': '+msg:' — ответ прокси пуст, см. консоль'));
    }
    var data=await r.json();
    var raw=data.choices[0].message.content.trim().replace(/```json|```/g,'').trim();
    var parsed=JSON.parse(raw);
    if(!Array.isArray(parsed))parsed=[parsed];
    var findAcc=function(name){
      if(!name)return accs[0]&&accs[0].id;
      var n=String(name).toLowerCase();
      var hit=accs.find(function(a){return a.name.toLowerCase()===n;})
           ||accs.find(function(a){return a.name.toLowerCase().indexOf(n)>=0||n.indexOf(a.name.toLowerCase())>=0;});
      return hit?hit.id:(accs[0]&&accs[0].id);
    };
    bankAiDraft=parsed.map(function(p){
      var type=(p.type==='income'||p.type==='transfer')?p.type:'expense';
      var cats=bankCatsFor(type);
      var ord=p.orderNum?orders.find(function(o){return o.num===p.orderNum;}):null;
      return {
        type:type,
        amount:Math.abs(parseFloat(p.amount)||0),
        date:/^\d{4}-\d{2}-\d{2}$/.test(p.date||'')?p.date:todayISO(),
        accountId:findAcc(p.account),
        toAccountId:type==='transfer'?findAcc(p.toAccount):'',
        category:cats.indexOf(p.category)>=0?p.category:cats[cats.length-1],
        direction:p.direction==='mk'?'mk':'toys',
        merchant:p.merchant||'',
        comment:p.merchant||'',
        orderId:ord?ord.id:''
      };
    }).filter(function(d){return d.amount>0;});
    if(!bankAiDraft.length){bankAiDraft=null;toast('Не удалось распознать сумму');}
    else{document.getElementById('fin-ai-input').value='';toast('✅ Распознано операций: '+bankAiDraft.length);}
    renderTab('bank');
  }catch(e){
    toast('⚠️ Ошибка: '+e.message);
    console.error('Finance AI error:',e);
    btn.disabled=false;btn.textContent='✨ Распознать';
  }
}

async function commitAiDraft(){
  if(!bankAiDraft||!bankAiDraft.length)return;
  var now=Date.now();
  var recs=bankAiDraft.map(function(d,i){
    return {
      id:uid(),kind:'tx',date:d.date,type:d.type,amount:d.amount,
      accountId:d.accountId,toAccountId:d.toAccountId||'',
      category:d.category,merchant:d.merchant||'',comment:d.comment||'',
      direction:d.type==='transfer'?'toys':(d.direction||'toys'),
      orderId:d.orderId||'',author:bankAuthor(),source:'ai',created:now+i
    };
  });
  var n=recs.length;
  bankAiDraft=null;
  var ok=await saveFinance(finance.concat(recs));
  renderTab('bank');
  if(ok)toast('✅ Добавлено операций: '+n);
}

function saveTx(){
  var v=function(id){var e=document.getElementById(id);return e?e.value:'';};
  var type=v('tx-type');
  var amount=Math.abs(parseFloat(v('tx-amount'))||0);
  if(!amount){toast('Укажите сумму');return;}
  var accId=v('tx-acc');
  var toAcc=type==='transfer'?v('tx-acc2'):'';
  if(type==='transfer'&&accId===toAcc){toast('Счета перевода совпадают');return;}
  var id=v('tx-id');
  var rec={
    id:id||uid(),kind:'tx',date:v('tx-date')||todayISO(),type:type,amount:amount,
    accountId:accId,toAccountId:toAcc,
    category:v('tx-cat')||'Прочее',
    merchant:'',comment:v('tx-comment'),
    direction:type==='transfer'?'toys':(v('tx-dir')||'toys'),
    orderId:type==='transfer'?'':v('tx-order'),
    author:bankAuthor(),source:'manual',created:Date.now()
  };
  var next;
  if(id){
    var old=finance.find(function(x){return x.id===id;});
    if(old){rec.created=old.created;rec.author=old.author;rec.source=old.source;}
    next=finance.map(function(x){return x.id===id?rec:x;});
  }else{
    next=finance.concat([rec]);
  }
  closeTxModal();
  saveFinance(next).then(function(ok){renderTab('bank');if(ok)toast(id?'Операция изменена':'Операция добавлена ✓');});
}
async function deleteTx(id){
  if(!confirm('Удалить операцию? Балансы пересчитаются.'))return;
  closeTxModal();
  var ok=await saveFinance(finance.filter(function(x){return x.id!==id;}));
  renderTab('bank');
  if(ok)toast('Операция удалена');
}

// ═══ НАСТРОЙКИ СЧЁТА ═══
function openAccountEdit(id){
  var a=accById(id);
  if(!a)return;
  var el=document.createElement('div');
  el.id='acc-modal';
  el.style.cssText='position:fixed;inset:0;background:rgba(60,48,32,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center';
  el.innerHTML='<div style="background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
      +'<div style="font-weight:700;letter-spacing:-.4px;font-size:17px;color:var(--accent)">'+a.name+'</div>'
      +'<button onclick="closeAccModal()" style="background:none;border:none;color:var(--text3);font-size:24px;line-height:1;cursor:pointer">×</button>'
    +'</div>'
    +'<div style="font-size:12px;color:var(--text3);margin-bottom:14px">Текущий баланс: <b style="color:var(--accent)">'+fmt(accBalance(a.id))+'</b></div>'
    +'<div class="form-grid">'
      +'<div class="fg span2"><label>Название</label><input id="acc-name" value="'+esc(a.name)+'"></div>'
      +'<div class="fg"><label>Начальный остаток (₽)</label><input id="acc-start" type="number" value="'+(a.startBalance||0)+'"></div>'
      +'<div class="fg"><label>На дату</label><input id="acc-date" type="date" value="'+(a.startDate||todayISO())+'"></div>'
      +'<div class="fg span2"><label>Тип счёта</label><select id="acc-type">'
        +'<option value="bank"'+(a.type==='bank'?' selected':'')+'>Расчётный — входит в «доступно к трате»</option>'
        +'<option value="savings"'+(a.type==='savings'?' selected':'')+'>Накопительный — в котле, но тратить нельзя</option>'
      +'</select></div>'
    +'</div>'
    +'<div style="font-size:10px;color:var(--text3);line-height:1.5;margin-bottom:12px">Начальный остаток — сколько было на счету на указанную дату. Все операции считаются поверх него.</div>'
    +'<div style="display:flex;gap:8px">'
      +'<button class="btn btn-danger btn-sm" onclick="archiveAccount(\''+a.id+'\')">Скрыть счёт</button>'
      +'<button class="btn btn-primary btn-sm" style="flex:1;justify-content:center" onclick="saveAccount(\''+a.id+'\')">Сохранить</button>'
    +'</div>'
    +'</div>';
  document.body.appendChild(el);
  el.addEventListener('click',function(e){if(e.target===el)closeAccModal();});
}
function closeAccModal(){var m=document.getElementById('acc-modal');if(m)m.remove();}
async function saveAccount(id){
  var v=function(x){var e=document.getElementById(x);return e?e.value:'';};
  var name=v('acc-name').trim();
  if(!name){toast('Укажите название');return;}
  var next=finance.map(function(r){
    if(r.id!==id)return r;
    return Object.assign({},r,{name:name,startBalance:parseFloat(v('acc-start'))||0,startDate:v('acc-date')||todayISO(),type:v('acc-type')});
  });
  closeAccModal();
  var ok=await saveFinance(next);
  renderTab('bank');
  if(ok)toast('Счёт сохранён ✓');
}
async function archiveAccount(id){
  var n=bankTxAll().filter(function(t){return t.accountId===id||t.toAccountId===id;}).length;
  if(!confirm('Скрыть счёт из списка?'+(n?'\nПо нему уже есть операций: '+n+'. Они останутся в базе, но пропадут из балансов.':'')))return;
  var next=finance.map(function(r){return r.id===id?Object.assign({},r,{archived:true}):r;});
  closeAccModal();
  var ok=await saveFinance(next);
  renderTab('bank');
  if(ok)toast('Счёт скрыт');
}

// ═══ ПОЛУАВТОМАТ: оплата в заказе → доход в банке ═══
// Никогда не создаём операцию молча. При росте оплаты по заказу предлагаем
// внести доход и спрашиваем счёт — подтверждает человек.
function offerOrderIncome(order,delta){
  if(!canSeeBank()||!financeTableOk||delta<=0)return;
  var accs=bankAccounts();
  if(!accs.length)return;
  var already=bankTxAll().filter(function(t){return t.orderId===order.id&&t.type==='income';})
    .reduce(function(s,t){return s+(parseFloat(t.amount)||0);},0);
  var el=document.createElement('div');
  el.id='oi-modal';
  el.style.cssText='position:fixed;inset:0;background:rgba(60,48,32,.5);z-index:320;display:flex;align-items:flex-end;justify-content:center';
  el.innerHTML='<div style="background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px">'
    +'<div style="font-weight:700;letter-spacing:-.4px;font-size:17px;color:var(--accent);margin-bottom:4px">Внести деньги в банк?</div>'
    +'<div style="font-size:12px;color:var(--text3);margin-bottom:14px">По заказу '+order.num+' оплата выросла на <b style="color:var(--green-ink)">'+fmt(delta)+'</b>.'
      +(already>0?'<br>Ранее по этому заказу уже проведено '+fmt(already)+'.':'')+'</div>'
    +'<div class="form-grid">'
      +'<div class="fg"><label>Сумма (₽)</label><input id="oi-amount" type="number" value="'+Math.round(delta)+'"></div>'
      +'<div class="fg"><label>Дата</label><input id="oi-date" type="date" value="'+todayISO()+'"></div>'
      +'<div class="fg span2"><label>На какой счёт пришли</label><select id="oi-acc">'+accs.filter(function(a){return a.type!=='savings';}).map(function(a){return '<option value="'+a.id+'">'+a.name+'</option>';}).join('')+'</select></div>'
      +'<div class="fg span2"><label>Категория</label><select id="oi-cat">'
        +'<option>Предоплата заказа</option><option'+(already>0?' selected':'')+'>Доплата заказа</option>'
      +'</select></div>'
    +'</div>'
    +'<div style="display:flex;gap:8px">'
      +'<button class="btn btn-secondary btn-sm" style="flex:1;justify-content:center" onclick="closeOiModal()">Не сейчас</button>'
      +'<button class="btn btn-primary btn-sm" style="flex:1;justify-content:center" onclick="confirmOrderIncome(\''+order.id+'\')">Внести</button>'
    +'</div>'
    +'</div>';
  document.body.appendChild(el);
  el.addEventListener('click',function(e){if(e.target===el)closeOiModal();});
}
function closeOiModal(){var m=document.getElementById('oi-modal');if(m)m.remove();}
async function confirmOrderIncome(orderId){
  var v=function(x){var e=document.getElementById(x);return e?e.value:'';};
  var amount=Math.abs(parseFloat(v('oi-amount'))||0);
  if(!amount){toast('Укажите сумму');return;}
  var rec={
    id:uid(),kind:'tx',date:v('oi-date')||todayISO(),type:'income',amount:amount,
    accountId:v('oi-acc'),toAccountId:'',category:v('oi-cat')||'Предоплата заказа',
    merchant:'',comment:'',direction:'toys',orderId:orderId,
    author:bankAuthor(),source:'order',created:Date.now()
  };
  closeOiModal();
  var ok=await saveFinance(finance.concat([rec]));
  if(ok)toast('Доход '+fmt(amount)+' внесён в банк ✓');
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

// Прокрутка колёсиком/тачпадом над числовым полем НЕ должна менять его значение:
// снимаем фокус с поля, чтобы прокручивалась страница, а не цифры.
document.addEventListener('wheel',function(e){
  var a=document.activeElement;
  if(a&&a.tagName==='INPUT'&&a.type==='number'&&a===e.target){a.blur();}
},{passive:true});

// Netlify version - password login only
window.addEventListener('load',function(){
  // Check if already logged in via sessionStorage
  const saved=sessionStorage.getItem('markovka_role');
  if(saved){
    try{
      const ui=JSON.parse(saved);
      login(ui.role,ui.name,ui.label,ui.masterName);
    }catch(e){/* ignore */}
  }
});
</script>
